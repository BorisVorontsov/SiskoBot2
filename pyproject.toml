[project]
name = "bashorg-tg-bot"
version = "1.0.0"
description = "Автономный Telegram-бот с цитатами башорг.рф"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001/002/003 помечают кириллицу в строках как «двусмысленную» —
# для русскоязычного проекта это ложные срабатывания.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# В тестах допускаем assert без сообщений и «плоские» фикстуры.
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
